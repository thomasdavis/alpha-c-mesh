# tick-w: a variant of tick (scripts/build-programs.sh copies tick's images under this name). wasm only: a CPU program the scheduler moves off a loaded member.
name       = "tick-w"
abi        = 6
view_bytes = 0x10000
view_abi   = 1
snap_bytes = 0x40
nodes      = 1
policy     = "periodic"
hz         = 50
counters   = ["ticks", "inits", "", ""]
fields     = ["magic:u32:0x0", "ticks:u32:0x4", "inits:u32:0x8", "mismatches:u32:0xc"]
autostart  = false
replicas   = 1
task_ms    = 2000
backends   = ["wasm"]
cpu        = 0.25
